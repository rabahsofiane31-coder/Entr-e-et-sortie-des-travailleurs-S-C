<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وثيقة دخول وخروج العمال</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#1f4e79">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<style>
:root{--ink:#1c2530;--paper:#fff;--bg:#e8ebef;--line:#c5ccd5;--accent:#1f4e79;--mut:#5f6b78;--err:#b3261e}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
input,select,button,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:5px;padding:8px 14px}
button.alt,label.alt{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px}
button.sm{padding:3px 10px;font-size:.88rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.screen{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:26px;width:100%;max-width:400px}
.card h1{margin:6px 0 4px;font-size:1.3rem}
.card p{margin:0 0 14px;color:var(--mut)}
.card label{display:block;margin-bottom:12px}
.card label span{display:block;margin-bottom:3px;font-size:.92rem}
.card input{width:100%;padding:10px;border:1px solid var(--line);border-radius:5px;font-size:1.3rem;letter-spacing:.4em;text-align:center}
.card button[type=submit]{width:100%;padding:10px}
.err{color:var(--err);min-height:1.5em;margin-bottom:6px;font-size:.92rem}
.langs{display:grid;gap:12px;margin-top:16px}
.langs button{padding:16px;font-size:1.25rem}
header{background:var(--accent);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header strong{font-size:1.1rem}
header nav,header .acts{display:flex;gap:8px}
header button{background:transparent;border-color:rgba(255,255,255,.6)}
header button.tab.on{background:#fff;color:var(--accent)}
main{max-width:1000px;margin:16px auto;padding:0 12px}
.panel,.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.panel h2,.panel h3{margin:0 0 10px;font-size:1.05rem}
.gate{max-width:380px;margin:30px auto}
.gate input{width:100%;padding:10px;border:1px solid var(--line);border-radius:5px;font-size:1.3rem;letter-spacing:.4em;text-align:center;margin-bottom:10px}
.gate button[type=submit]{width:100%;padding:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input,.panel textarea{padding:8px 10px;border:1px solid var(--line);border-radius:5px}
.panel textarea{width:100%;margin-bottom:8px}
.muted{color:var(--mut);font-size:.9rem;margin:0 0 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:#f0f3f6}
.logo{display:block;width:100%;max-height:130px;object-fit:contain;margin-bottom:6px}
.head{margin-bottom:10px}
.head .title{font-size:1.35rem;padding:12px}
.head td{text-align:start;padding:8px 12px}
.head input,.head select{padding:5px 8px;border:1px solid var(--line);border-radius:4px;margin-inline-start:6px}
#date{width:120px;text-align:center;font-variant-numeric:tabular-nums}
.main{table-layout:fixed;min-width:900px}
.main col.c1{width:7%}.main col.c2{width:20%}.main col.c3{width:28%}.main col.c4{width:8%}.main col.c5{width:8%}.main col.c6{width:7%}.main col.c7{width:22%}
.main td input[data-f=mat]{padding:2px 2px}
.main td{height:40px;padding:0}
.main td.name,.main td.dept{text-align:start;padding:0 8px}
.main td input,.main td select{width:100%;height:100%;min-height:38px;border:0;background:transparent;text-align:center;padding:2px 6px}
.main td input:focus,.main td select:focus{background:#eaf2fa;outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.main td input.bad{background:#fde7e5}
.nf{color:var(--err);font-size:.85rem}
.hrs{font-weight:600;font-variant-numeric:tabular-nums}
.hrs.warn{color:var(--err)}
.sign{display:flex;gap:20px;margin-top:16px}
.sign div{flex:1;border:1px solid var(--line);min-height:96px;padding:8px 10px;text-align:center;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.empty{color:var(--mut);padding:14px}
#wTable td.nm{text-align:start}
#printOut{display:none}

/* ---- print: one A4 sheet per page ---- */
@media print{
 @page{size:A4 portrait;margin:10mm}
 html,body{background:#fff;margin:0}
 body>*{display:none!important}
 body>#printOut{display:block!important}
 .psheet{height:276mm;display:flex;flex-direction:column;overflow:hidden;page-break-after:always;break-after:page;color:#000}
 .psheet:last-child{page-break-after:auto;break-after:auto}
 .phead{width:100%;height:32mm;object-fit:contain;display:block}
 .prule{border-top:2px solid #1f4e79;border-bottom:1px solid #1f4e79;height:3px;margin:1mm 0 3mm}
 .pmeta{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:1mm}
 .psheet h2{margin:0 0 3mm;text-align:center;font-size:18px;text-decoration:underline}
 .ptab{table-layout:fixed;width:100%;border-collapse:collapse}
 .ptab th,.ptab td{border:1px solid #000;padding:0 3px;font-size:11.5px;text-align:center;overflow:hidden}
 .ptab th{background:#eee!important;height:10mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ptab td{line-height:1.15}
 .ptab td.l{text-align:start}
 .psign{display:flex;justify-content:space-between;margin-top:5mm;height:24mm;font-weight:700;font-size:13px}
 .psign div{width:48%;height:100%;border:1.5px solid #000;padding:2mm 3mm;text-align:center}
 .pfoot{margin-top:auto;width:100%;height:16mm;object-fit:contain;display:block}
}
</style>
</head>
<body>

<!-- Auth -->
<div id="auth" class="screen">
 <div class="card">
  <button type="button" class="link" id="authLangBtn"></button>
  <h1 id="authTitle"></h1>
  <p id="authHint"></p>
  <form id="authForm" autocomplete="off">
   <label><span id="pin1Label"></span><input id="pin1" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
   <label id="pin2wrap"><span data-i="confirmPin"></span><input id="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
   <div id="authErr" class="err" role="alert"></div>
   <button type="submit" id="authBtn"></button>
  </form>
  <button type="button" class="link" id="forgot" data-i="forgot"></button>
 </div>
</div>

<!-- Language -->
<div id="langScreen" class="screen" hidden>
 <div class="card">
  <h1>اختر اللغة<br><small style="font-weight:400;color:var(--mut)">Choisissez la langue</small></h1>
  <div class="langs">
   <button type="button" data-lang="ar">العربية</button>
   <button type="button" data-lang="fr">Français</button>
  </div>
 </div>
</div>

<!-- App -->
<div id="app" hidden>
 <header>
  <strong data-i="appTitle"></strong>
  <nav>
   <button type="button" class="tab on" data-tab="doc" data-i="tabDoc"></button>
   <button type="button" class="tab" data-tab="db" data-i="tabDb"></button>
  </nav>
  <div class="acts">
   <button type="button" id="appLangBtn"></button>
   <button type="button" id="lockBtn" data-i="lock"></button>
  </div>
 </header>

 <main>
  <section id="vDoc">
   <div class="sheet">
    <img class="logo" id="screenHdr" alt="SOMIPHOS">
    <table class="head">
     <tr><th colspan="3" class="title" data-i="appTitle"></th></tr>
     <tr>
      <td><span data-i="date"></span>: <input id="date" inputmode="numeric" maxlength="10" placeholder="jj/mm/aaaa" autocomplete="off"></td>
      <td><span data-i="shift"></span>: <select id="shift"></select></td>
      <td><span data-i="page"></span>: <select id="page"><option value="1">1</option><option value="2">2</option></select></td>
     </tr>
    </table>
    <div class="scroll">
     <table class="main">
      <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"><col class="c7"></colgroup>
      <thead><tr>
       <th data-i="colMat"></th><th data-i="colName"></th><th data-i="colDept"></th><th data-i="colIn"></th>
       <th data-i="colOut"></th><th data-i="colHours"></th><th data-i="colReason"></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
     </table>
    </div>
    <div class="sign"><div data-i="sigShift"></div><div data-i="sigDept"></div></div>
   </div>
   <div class="bar">
    <button type="button" id="printBtn" data-i="printPage"></button>
    <button type="button" id="printBoth" data-i="printBoth"></button>
    <button type="button" class="alt" id="addRow" data-i="addRow"></button>
    <button type="button" class="alt" id="clearSheet" data-i="clearSheet"></button>
   </div>
  </section>

  <section id="vDb" hidden>
   <div id="dbGate" class="panel gate">
    <h2 id="dbGateTitle"></h2>
    <p class="muted" id="dbGateHint"></p>
    <form id="dbGateForm" autocomplete="off">
     <input id="dbp1" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
     <div id="dbp2wrap"><p class="muted" data-i="confirmPin"></p><input id="dbp2" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
     <div id="dbErr" class="err" role="alert"></div>
     <button type="submit" id="dbGateBtn"></button>
    </form>
    <button type="button" class="link" id="dbForgot" data-i="dbForgot"></button>
   </div>

   <div id="dbContent" hidden>
    <div class="panel">
     <h2 data-i="dbTitle"></h2>
     <form id="wForm" class="row" autocomplete="off">
      <input id="wMat" data-ph="mat" style="width:140px">
      <input id="wName" data-ph="fullName" style="flex:1;min-width:180px">
      <input id="wDept" data-ph="dept" list="deptlist" style="width:200px">
      <button type="submit" data-i="save"></button>
     </form>
    </div>
    <div class="panel">
     <h3 data-i="bulkTitle"></h3>
     <p class="muted" data-i="bulkHint"></p>
     <textarea id="bulk" rows="5" dir="auto"></textarea>
     <div class="row"><button type="button" id="bulkBtn" data-i="import"></button><span id="bulkMsg" class="muted"></span></div>
    </div>
    <div class="panel">
     <div class="row" style="margin-bottom:10px">
      <input id="q" type="search" data-ph="search">
      <span id="cnt" class="muted"></span>
      <button type="button" class="alt" id="backup" data-i="backup"></button>
      <button type="button" class="alt" id="delAll" data-i="delAll" style="color:var(--err);border-color:var(--err)"></button>
      <label class="alt" style="cursor:pointer;padding:8px 14px;border-radius:5px"><span data-i="restore"></span><input type="file" id="restore" accept=".json" hidden></label>
     </div>
     <div class="scroll"><table id="wTable"></table></div>
    </div>
   </div>
  </section>
 </main>
</div>

<div id="printOut"></div>
<datalist id="matlist"></datalist>
<datalist id="deptlist"></datalist>

const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtD=d=>String(d||'').split('-').reverse().join('/');
function toIso(s){
 const m=String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return null;
 const d=+m[1],mo=+m[2],y=+m[3],dt=new Date(y,mo-1,d);
 if(y<2000||dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
 return y+'-'+pad(mo)+'-'+pad(d);
}
function hash(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
const newSalt=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const digitsOnly=sel=>$(sel).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});

let appOn=false,dbOpen=false,curDate=today();

/* ---------- language ---------- */
function applyLang(){
 const L=db.lang,de=document.documentElement;
 de.lang=L;de.dir=L==='ar'?'rtl':'ltr';
 document.title=t('appTitle');
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 const other=L==='ar'?'Français':'العربية';
 $('#authLangBtn').textContent=other;$('#appLangBtn').textContent=other;
 $('#date').placeholder=L==='ar'?'يوم/شهر/سنة':'jj/mm/aaaa';
 renderAuth();renderShiftOpts();renderDbGate();
 if(appOn){renderTable();renderDb()}
}
function toggleLang(){db.lang=db.lang==='ar'?'fr':'ar';save();$('#authErr').textContent='';applyLang()}
$('#authLangBtn').onclick=toggleLang;$('#appLangBtn').onclick=toggleLang;

/* ---------- main PIN ---------- */
function showScreen(n){$('#auth').hidden=n!=='auth';$('#langScreen').hidden=n!=='lang';$('#app').hidden=n!=='app';appOn=n==='app'}
function renderAuth(){
 const setup=!db.pin;
 $('#authTitle').textContent=t(setup?'setupTitle':'loginTitle');
 $('#authHint').textContent=t(setup?'setupHint':'loginHint');
 $('#pin1Label').textContent=t(setup?'newPin':'secretCode');
 $('#pin2wrap').hidden=!setup;$('#forgot').hidden=setup;
 $('#authBtn').textContent=t(setup?'approve':'enter');
}
['#pin1','#pin2','#dbp1','#dbp2'].forEach(digitsOnly);
function clearPins(){$('#pin1').value='';$('#pin2').value='';$('#authErr').textContent=''}
$('#authForm').onsubmit=e=>{
 e.preventDefault();
 const p1=$('#pin1').value,p2=$('#pin2').value,err=$('#authErr');
 err.textContent='';
 if(!db.pin){
  if(!/^\d{6}$/.test(p1)){err.textContent=t('errPinFormat');return}
  if(p1!==p2){err.textContent=t('errPinMatch');return}
  db.salt=newSalt();db.pin=hash(db.salt+p1);save();
 }else if(hash(db.salt+p1)!==db.pin){err.textContent=t('errPinWrong');$('#pin1').select();return}
 clearPins();showScreen('lang');
};
$('#forgot').onclick=()=>{
 if(!confirm(t('forgotConfirm')))return;
 db={salt:'',pin:'',dbSalt:'',dbPin:'',workers:[],sheets:{},lang:db.lang};save();clearPins();renderAuth();
};
$$('[data-lang]').forEach(b=>b.onclick=()=>{db.lang=b.dataset.lang;save();showScreen('app');applyLang();loadSheet()});
function lockAll(){dbOpen=false;clearPins();renderAuth();showScreen('auth')}
$('#lockBtn').onclick=lockAll;

/* ---------- tabs + database PIN ---------- */
function showTab(name){
 $$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===name));
 $('#vDoc').hidden=name!=='doc';$('#vDb').hidden=name!=='db';
 if(name==='doc'){dbOpen=false;renderDbGate();renderTable()}
 else{renderDbGate();if(dbOpen)renderDb()}
}
$$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function renderDbGate(){
 const setup=!db.dbPin;
 $('#dbGate').hidden=dbOpen;$('#dbContent').hidden=!dbOpen;
 $('#dbGateTitle').textContent=t(setup?'dbSetupTitle':'dbUnlockTitle');
 $('#dbGateHint').textContent=t(setup?'dbSetupHint':'dbUnlockHint');
 $('#dbp2wrap').hidden=!setup;$('#dbForgot').hidden=setup;
 $('#dbGateBtn').textContent=t(setup?'approve':'unlock');
}
$('#dbGateForm').onsubmit=e=>{
 e.preventDefault();
 const p1=$('#dbp1').value,p2=$('#dbp2').value,err=$('#dbErr');
 err.textContent='';
 if(!db.dbPin){
  if(!/^\d{6}$/.test(p1)){err.textContent=t('errPinFormat');return}
  if(p1!==p2){err.textContent=t('errPinMatch');return}
  db.dbSalt=newSalt();db.dbPin=hash(db.dbSalt+p1);save();
 }else if(hash(db.dbSalt+p1)!==db.dbPin){err.textContent=t('errDbWrong');$('#dbp1').select();return}
 $('#dbp1').value='';$('#dbp2').value='';dbOpen=true;renderDbGate();renderDb();
};
$('#dbForgot').onclick=()=>{
 const p=prompt(t('dbForgotPrompt'));if(p===null)return;
 if(hash(db.salt+p.trim())!==db.pin){$('#dbErr').textContent=t('errPinWrong');return}
 db.dbPin='';db.dbSalt='';save();$('#dbErr').textContent='';renderDbGate();
};

/* ---------- document ---------- */
const IN_T=['','5:00','6:00','7:00','13:00','21:00'];
const REASONS=['','c18','c91','nodoc','expelled','nurse','admin','comp'];
const rLabel=v=>v?t('r_'+v):'';
const blankRows=n=>Array.from({length:n},()=>({mat:'',in:'',out:'',reason:''}));
let sheet={rows:blankRows(20)};
$('#screenHdr').src=HDR;
$('#date').value=fmtD(curDate);

const keyFor=pg=>curDate+'|'+$('#shift').value+'|'+pg;
const curKey=()=>keyFor($('#page').value);
function getSheet(pg){
 return db.sheets[keyFor(pg)]||(pg==='1'&&db.sheets[curDate+'|'+$('#shift').value])||{rows:blankRows(20)};
}
function renderShiftOpts(){
 const s=$('#shift'),cur=s.value||'1';
 s.innerHTML=['1','2','3'].map(v=>`<option value="${v}">${esc(t('shift'+v))}</option>`).join('');
 s.value=cur;
}
function loadSheet(){sheet=getSheet($('#page').value);renderTable()}
const persist=()=>{db.sheets[curKey()]=sheet;save()};
const workerBy=m=>{m=String(m||'').trim().toLowerCase();return m?db.workers.find(w=>w.mat.toLowerCase()===m):null};
function parseT(v){
 v=String(v||'').trim();
 const m=v.match(/^(\d{1,2}):(\d{2})$/)||v.match(/^(\d{1,2})(\d{2})$/);
 if(!m)return null;
 const h=+m[1],mi=+m[2];
 return h>23||mi>59?null:h*60+mi;
}
function minsOf(r){const a=parseT(r.in),b=parseT(r.out);if(a===null||b===null)return null;let d=b-a;if(d<0)d+=1440;return d}
const hoursStr=r=>{const d=minsOf(r);return d===null?'':Math.floor(d/60)+':'+pad(d%60)};
const opts=(arr,sel,lab)=>arr.map(v=>`<option value="${v}"${v===sel?' selected':''}>${esc(lab(v))}</option>`).join('');
function rowHtml(r,i){
 return `<tr data-i="${i}">
 <td><input data-f="mat" list="matlist" value="${esc(r.mat)}" autocomplete="off"></td>
 <td class="name"></td><td class="dept"></td>
 <td><select data-f="in">${opts(IN_T,r.in,v=>v)}</select></td>
 <td><input data-f="out" value="${esc(r.out)}" inputmode="numeric" maxlength="5" placeholder="--:--" autocomplete="off"></td>
 <td class="hrs"></td>
 <td><select data-f="reason">${opts(REASONS,r.reason,rLabel)}</select></td></tr>`;
}
function calcRow(i){
 const tr=$('#tbody').children[i],r=sheet.rows[i];if(!tr)return;
 const w=workerBy(r.mat);
 tr.querySelector('.name').innerHTML=w?esc(w.name):(r.mat.trim()?`<span class="nf">${esc(t('notFound'))}</span>`:'');
 tr.querySelector('.dept').textContent=w?(w.dept||''):'';
 const d=minsOf(r),h=tr.querySelector('.hrs'),oi=tr.querySelector('[data-f=out]');
 h.textContent=hoursStr(r);h.classList.toggle('warn',d!==null&&d>720);
 oi.classList.toggle('bad',!!r.out&&parseT(r.out)===null&&document.activeElement!==oi);
}
function renderTable(){
 $('#tbody').innerHTML=sheet.rows.map(rowHtml).join('');
 sheet.rows.forEach((_,i)=>calcRow(i));
}
function onEdit(e){
 const el=e.target,tr=el.closest&&el.closest('tr'),f=el.dataset&&el.dataset.f;
 if(!tr||!f)return;
 const i=+tr.dataset.i;
 if(f==='out'){
  let v=el.value.replace(/[^\d:]/g,'').slice(0,5);
  if(/^\d{4}$/.test(v))v=v.slice(0,2)+':'+v.slice(2);
  if(v!==el.value)el.value=v;
 }
 sheet.rows[i][f]=el.value;persist();calcRow(i);
}
$('#tbody').addEventListener('input',onEdit);
$('#tbody').addEventListener('change',onEdit);
$('#tbody').addEventListener('focusout',e=>{
 const el=e.target;if(el.dataset.f!=='out')return;
 const i=+el.closest('tr').dataset.i;let v=el.value.trim();
 if(/^\d{1,2}$/.test(v))v+=':00';
 const p=parseT(v);if(p!==null)v=Math.floor(p/60)+':'+pad(p%60);
 el.value=v;sheet.rows[i].out=v;persist();calcRow(i);
});

/* numeric date: jj/mm/aaaa */
const di=$('#date');
di.addEventListener('input',()=>{
 const d=di.value.replace(/\D/g,'').slice(0,8);
 let o=d.slice(0,2);if(d.length>2)o+='/'+d.slice(2,4);if(d.length>4)o+='/'+d.slice(4);
 di.value=o;
 if(d.length===8){const iso=toIso(o);if(iso&&iso!==curDate){curDate=iso;loadSheet()}}
});
di.addEventListener('blur',()=>{if(!toIso(di.value))di.value=fmtD(curDate)});
$('#shift').onchange=loadSheet;$('#page').onchange=loadSheet;
$('#addRow').onclick=()=>{
 if(sheet.rows.length>=MAXROWS){alert(t('maxRows'));return}
 sheet.rows.push({mat:'',in:'',out:'',reason:''});persist();renderTable();
};
$('#clearSheet').onclick=()=>{if(!confirm(t('clearConfirm')))return;delete db.sheets[curKey()];save();loadSheet()};

/* ---------- printing: one A4 sheet per page ---------- */
function sheetHtml(pg){
 const s=getSheet(pg),n=s.rows.length,rh=Math.min(9,Math.floor(1690/n)/10);
 const body=s.rows.map(r=>{
  const w=workerBy(r.mat);
  return `<tr style="height:${rh}mm"><td>${esc(r.mat)}</td><td class="l">${w?esc(w.name):''}</td><td class="l">${w?esc(w.dept||''):''}</td><td>${esc(r.in)}</td><td>${esc(r.out)}</td><td>${hoursStr(r)}</td><td>${esc(rLabel(r.reason))}</td></tr>`;
 }).join('');
 return `<section class="psheet"><img class="phead" src="${HDR}" alt="">
 <div class="prule"></div>
 <div class="pmeta"><span>${esc(t('place'))} ${esc(fmtD(curDate))}</span><span>${esc(t('shift'+$('#shift').value))} — ${esc(t('pageWord'))} ${pg}</span></div>
 <h2>${esc(t('appTitle'))}</h2>
 <table class="ptab"><colgroup><col style="width:7%"><col style="width:20%"><col style="width:28%"><col style="width:8%"><col style="width:8%"><col style="width:7%"><col style="width:22%"></colgroup>
 <thead><tr><th>${esc(t('colMat'))}</th><th>${esc(t('colName'))}</th><th>${esc(t('colDept'))}</th><th>${esc(t('colIn'))}</th><th>${esc(t('colOut'))}</th><th>${esc(t('colHours'))}</th><th>${esc(t('colReason'))}</th></tr></thead>
 <tbody>${body}</tbody></table>
 <div class="psign"><div>${esc(t('sigShift'))}</div><div>${esc(t('sigDept'))}</div></div>
 <img class="pfoot" src="${FTR}" alt=""></section>`;
}
function doPrint(pages){$('#printOut').innerHTML=pages.map(sheetHtml).join('');window.print()}
$('#printBtn').onclick=()=>doPrint([$('#page').value]);
$('#printBoth').onclick=()=>doPrint(['1','2']);
window.addEventListener('afterprint',()=>{$('#printOut').innerHTML=''});

/* ---------- database ---------- */
function upsert(mat,name,dept,keepDept){
 const w=workerBy(mat);
 if(w){w.name=name;if(!keepDept||dept)w.dept=dept||'';return'u'}
 db.workers.push({mat:mat,name:name,dept:dept||''});return'a';
}
function renderDb(){
 const q=$('#q').value.trim().toLowerCase();
 const list=db.workers.filter(w=>!q||w.mat.toLowerCase().includes(q)||w.name.toLowerCase().includes(q)||(w.dept||'').toLowerCase().includes(q))
  .sort((a,b)=>a.mat.localeCompare(b.mat,undefined,{numeric:true}));
 $('#cnt').textContent=t('count')+': '+db.workers.length;
 $('#wTable').innerHTML=`<thead><tr><th style="width:16%">${esc(t('mat'))}</th><th>${esc(t('fullName'))}</th><th style="width:26%">${esc(t('dept'))}</th><th style="width:160px"></th></tr></thead><tbody>`+
  (list.length?list.map(w=>`<tr><td>${esc(w.mat)}</td><td class="nm">${esc(w.name)}</td><td class="nm">${esc(w.dept||'')}</td><td>
   <button class="alt sm" data-edit="${esc(w.mat)}">${esc(t('edit'))}</button>
   <button class="alt sm" data-del="${esc(w.mat)}">${esc(t('del'))}</button></td></tr>`).join('')
   :`<tr><td colspan="4" class="empty">${esc(t('emptyDb'))}</td></tr>`)+'</tbody>';
 $('#matlist').innerHTML=db.workers.map(w=>`<option value="${esc(w.mat)}">${esc(w.name)}</option>`).join('');
 const ds=[...new Set(db.workers.map(w=>w.dept).filter(Boolean))];
 $('#deptlist').innerHTML=ds.map(d=>`<option value="${esc(d)}"></option>`).join('');
}
$('#q').oninput=renderDb;
$('#wForm').onsubmit=e=>{
 e.preventDefault();
 const m=$('#wMat').value.trim(),n=$('#wName').value.trim(),d=$('#wDept').value.trim();
 if(!m||!n)return;
 upsert(m,n,d,false);save();
 $('#wMat').value='';$('#wName').value='';$('#wDept').value='';renderDb();$('#wMat').focus();
};
$('#wTable').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.edit!==undefined){const w=workerBy(b.dataset.edit);if(w){$('#wMat').value=w.mat;$('#wName').value=w.name;$('#wDept').value=w.dept||'';$('#wName').focus()}}
 else if(b.dataset.del!==undefined){if(!confirm(t('delConfirm')))return;db.workers=db.workers.filter(w=>w.mat!==b.dataset.del);save();renderDb()}
});
$('#bulkBtn').onclick=()=>{
 let a=0,u=0;
 $('#bulk').value.split(/\r?\n/).forEach(line=>{
  let mat,name,dept='';
  if(/[;\t,]/.test(line)){
   const p=line.split(/[;\t,]/).map(x=>x.trim());
   if(p.length<2||!p[0]||!p[1])return;
   mat=p[0];name=p[1];dept=p[2]||'';
  }else{
   const m=line.match(/^\s*(\S+)\s+(.+?)\s*$/);if(!m)return;
   mat=m[1];name=m[2];
  }
  upsert(mat,name,dept,true)==='a'?a++:u++;
 });
 save();renderDb();
 $('#bulkMsg').textContent=t('importedMsg').replace('{a}',a).replace('{u}',u);
 if(a+u)$('#bulk').value='';
};
function download(name,text,type){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));
 a.download=name;document.body.appendChild(a);a.click();a.remove();
}
$('#delAll').onclick=()=>{
 if(!db.workers.length)return;
 if(!confirm(t('delAllConfirm').replace('{n}',db.workers.length)))return;
 db.workers=[];save();renderDb();
};
$('#backup').onclick=()=>download('backup_'+today()+'.json',JSON.stringify({workers:db.workers,sheets:db.sheets}),'application/json');
$('#restore').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const d=JSON.parse(rd.result);
   if(!Array.isArray(d.workers)||typeof d.sheets!=='object'||!d.sheets)throw 0;
   if(!confirm(t('restoreConfirm')))return;
   db.workers=d.workers;db.sheets=d.sheets;save();loadSheet();renderDb();alert(t('restoreOk'));
  }catch(x){alert(t('restoreBad'))}
 };
 rd.readAsText(f);e.target.value='';
};

/* ---------- start ---------- */
renderShiftOpts();applyLang();showScreen('auth');
})();
</script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
